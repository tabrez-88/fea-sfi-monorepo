# ===========================================
# SFI-FEA Docker Compose - Development
# For local development with hot reload
# ===========================================

services:
  # Backend API service with hot reload
  sfi-api:
    build:
      context: .
      dockerfile: apps/sfi-api/Dockerfile
      target: builder
    command: ['pnpm', 'dev']
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - ./apps/sfi-api/.env
    volumes:
      # Mount source code for hot reload
      - ./apps/sfi-api/src:/app/apps/sfi-api/src:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
    networks:
      - sfi-network
    restart: unless-stopped

networks:
  sfi-network:
    driver: bridge
