version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfi-fea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfi_password}
      POSTGRES_DB: ${POSTGRES_DB:-sfi_fea_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfi_user} -d ${POSTGRES_DB:-sfi_fea_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfi-fea-network

volumes:
  postgres_data:
    driver: local

networks:
  sfi-fea-network:
    driver: bridge
