  #     - NODE_ENV=staging
  #     - NEXT_PUBLIC_API_URL=http://sfi-api:3001
  #   depends_on:
  #     - sfi-api
  #   networks:
  #     - sfi-network
  #   restart: unless-stopped

networks:
  sfi-network:
    driver: bridge
